name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dash-auth-flask
    env:
      APP_ENV: test
      SECRET_KEY: ci-test-secret
      DATABASE_URL: sqlite:///ci.db
      MAIL_BACKEND: console
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dash-auth-flask/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run unit and integration tests
        run: python -m pytest -m "not browser" --cov=. --cov-report=term-missing

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dash-auth-flask
    env:
      APP_ENV: test
      SECRET_KEY: ci-browser-secret
      DATABASE_URL: sqlite:///browser.db
      MAIL_BACKEND: console
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dash-auth-flask/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run browser test
        run: python -m pytest -m browser

  containers:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate production Compose model
        run: docker compose config --quiet
      - name: Validate development Compose model
        run: docker compose -f docker-compose.yml -f docker-compose-development.yml config --quiet
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build application for AMD64 and ARM64
        uses: docker/build-push-action@v7
        with:
          context: ./dash-auth-flask
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
      - name: Build Nginx image
        run: docker compose build nginx
