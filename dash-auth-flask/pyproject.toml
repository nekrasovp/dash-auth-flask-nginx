[tool.pytest.ini_options]
addopts = "-ra -W error"
testpaths = ["tests"]
markers = [
    "browser: end-to-end tests requiring Chrome",
]
filterwarnings = [
    "ignore:.*pkg_resources.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
